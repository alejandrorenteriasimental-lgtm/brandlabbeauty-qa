# IndexNow sin webhook de Netlify (más simple y sin secretos que proteger): corre a diario, lee el sitemap
# y envía solo las URL cuyo lastmod cambió desde el último envío. El estado vive en la caché de Actions.
# Consumo: < 1 min/día → ~20 min/mes.
name: IndexNow diario
on:
  schedule:
    - cron: '41 13 * * *'   # 07:41 CDMX
  workflow_dispatch: {}
permissions: {}
concurrency: { group: indexnow, cancel-in-progress: false }
jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: read, issues: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }
      - name: Recuperar el último estado enviado
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with: { path: indexnow-estado.json, key: 'indexnow-${{ github.run_id }}', restore-keys: 'indexnow-' }
      - name: Enviar URL modificadas
        run: node scripts/indexnow.mjs
      - name: Guardar estado
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with: { path: indexnow-estado.json, key: 'indexnow-${{ github.run_id }}' }
      - name: Alerta si falló
        if: failure()
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          gh label create alerta-qa --color B99C4E 2>/dev/null || true
          N=$(gh issue list --label alerta-qa --state open --json number --jq '.[0].number')
          MSG="IndexNow falló: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$N" ]; then gh issue comment "$N" --body "$MSG"; else gh issue create --title "Alerta IndexNow · $(date +%F)" --label alerta-qa --body "$MSG"; fi
