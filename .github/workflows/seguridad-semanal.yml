# Control semanal de seguridad del repositorio público: credenciales, datos personales, permisos, acciones sin fijar y artefactos.
name: Seguridad semanal
on:
  schedule:
    - cron: '47 15 * * 1'   # lunes 09:47 CDMX
  workflow_dispatch: {}
permissions: {}
concurrency: { group: seguridad, cancel-in-progress: false }
jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: { contents: read, actions: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: '20' }
      - name: Revisar archivos, workflows y artefactos
        run: node scripts/seguridad.mjs
        env: { GH_TOKEN: '${{ github.token }}' }
  alerta:
    needs: [escanear]
    if: ${{ always() && needs.escanear.result != 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { issues: write }
    steps:
      - name: Abrir o actualizar la alerta
        env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
        run: |
          gh label create alerta-qa --color B99C4E 2>/dev/null || true
          N=$(gh issue list --label alerta-qa --state open --json number --jq '.[0].number')
          MSG="Control de seguridad con hallazgos: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$N" ]; then gh issue comment "$N" --body "$MSG"; else gh issue create --title "Alerta de seguridad · $(date +%F)" --label alerta-qa --body "$MSG"; fi
